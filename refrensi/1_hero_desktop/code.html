<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance Web Developer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #14171F;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="bg-[#FFFFFF] text-[#14171F] min-h-screen flex flex-col">
  <!-- 1. Navbar -->
  <header class="w-full bg-[#FFFFFF] border-b border-[#E5E7EB]">
    <nav class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-center">
      <div class="flex items-center space-x-10 text-[15px] font-medium text-[#14171F]">
        <a href="#home" class="hover:text-[#E52521] transition-colors">Home</a>
        <a href="#jenis" class="hover:text-[#E52521] transition-colors">Jenis</a>
        <a href="#paket" class="hover:text-[#E52521] transition-colors">Paket</a>
        <a href="#kontak" class="hover:text-[#E52521] transition-colors">Kontak</a>
      </div>
    </nav>
  </header>

  <!-- Main Hero Content -->
  <main class="w-full max-w-5xl mx-auto px-6 pt-32 pb-32">
    <!-- 2. Heading & Muted Subtitle -->
    <div class="max-w-3xl">
      <h1 class="text-5xl font-bold tracking-tight text-[#14171F] leading-[1.18] mb-6">
        Jasa Pembuatan Website untuk Segala Kebutuhan
      </h1>
      <p class="text-lg text-[#6B7280] font-normal leading-relaxed mb-10">
        Dari toko online, company profile, blog, sistem reservasi, sampai sistem cashier dan sistem lainnya.
      </p>

      <!-- 3. Two Buttons Row -->
      <div class="flex items-center space-x-4">
        <a href="#view-cv" class="inline-flex items-center justify-center bg-[#E52521] text-[#FFFFFF] font-medium text-base px-7 py-3.5 rounded-[10px] hover:bg-[#c91e1a] transition-colors text-center">
          View CV
        </a>
        <a href="#download-cv" class="inline-flex items-center justify-center bg-[#FFFFFF] text-[#E52521] border border-[#E52521] font-medium text-base px-7 py-3.5 rounded-[10px] hover:bg-[#fff5f5] transition-colors text-center">
          Download CV
        </a>
      </div>
    </div>
  </main>

</body></html>
