<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Developer Service - Mobile Scrolled</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #14171F;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-white text-[#14171F] min-h-[844px] flex justify-center">

  <!-- Mobile phone frame container (390px x 844px) -->
  <div class="w-[390px] min-h-[844px] bg-white relative overflow-hidden flex flex-col">

    <!-- Floating Capsule Navbar (Mobile: 16px margins, spans width minus margins) -->
    <header class="fixed top-4 left-0 right-0 max-w-[390px] mx-auto z-50 px-4 pointer-events-none">
      <nav class="pointer-events-auto w-full flex items-center justify-between px-2 py-2 rounded-full border border-[rgba(255,255,255,0.35)] shadow-[inset_0_1px_1px_rgba(255,255,255,0.6)] backdrop-blur-md" style="background-color: rgba(229, 37, 33, 0.78);">
        <a href="#home" class="flex-1 text-center text-white text-xs font-medium py-1.5 rounded-full bg-[rgba(255,255,255,0.25)]">Home</a>
        <a href="#jenis" class="flex-1 text-center text-white text-xs font-medium py-1.5 rounded-full">Jenis</a>
        <a href="#paket" class="flex-1 text-center text-white text-xs font-medium py-1.5 rounded-full">Paket</a>
        <a href="#kontak" class="flex-1 text-center text-white text-xs font-medium py-1.5 rounded-full">Kontak</a>
      </nav>
    </header>

    <!-- Page Content scrolled slightly under the capsule navbar -->
    <main class="px-6 pt-20 flex-1">
      <h1 class="text-[28px] font-bold text-[#14171F] leading-[1.25] tracking-tight mb-4 max-w-[320px]">
        Jasa Pembuatan<br>Website untuk<br>Segala Kebutuhan
      </h1>
      <p class="text-[15px] text-[#6B7280] leading-[1.6] mb-8 font-normal">
        Dari toko online, company profile, blog, sistem reservasi, sampai sistem cashier dan sistem lainnya.
      </p>
      <div class="flex items-center gap-3">
        <a href="#view-cv" class="inline-flex items-center justify-center bg-[#E52521] text-white font-medium text-sm h-[44px] px-6 rounded-[10px]">
          View CV
        </a>
        <a href="#download-cv" class="inline-flex items-center justify-center bg-white text-[#E52521] border border-[#E52521] font-medium text-sm h-[44px] px-6 rounded-[10px]">
          Download CV
        </a>
      </div>
    </main>

  </div>


</body></html>
