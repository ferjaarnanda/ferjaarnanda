<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Developer Service - Desktop View CV Pressed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #14171F;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="min-h-screen bg-white text-[#14171F] relative overflow-hidden">

  <!-- Background Content (Dimmed) -->
  <div class="filter brightness-90 pointer-events-none select-none">
    <!-- Navbar -->
    <header class="w-full bg-white border-b border-[#E5E7EB]">
      <div class="max-w-5xl mx-auto flex items-center justify-center h-14">
        <nav class="flex items-center gap-8 text-sm font-medium text-[#14171F]">
          <span class="text-[#E52521]">Home</span>
          <span>Jenis</span>
          <span>Paket</span>
          <span>Kontak</span>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-8 pt-20">
      <div class="max-w-3xl">
        <h1 class="text-5xl font-bold tracking-tight text-[#14171F] leading-[1.15] mb-6">
          Jasa Pembuatan Website untuk Segala Kebutuhan
        </h1>
        <p class="text-lg text-[#6B7280] leading-relaxed mb-10 font-normal">
          Dari toko online, company profile, blog, sistem reservasi, sampai sistem cashier dan sistem lainnya.
        </p>
        <div class="flex items-center gap-3">
          <div class="inline-flex items-center justify-center bg-[#E52521] text-white font-medium text-base h-11 px-6 rounded-[10px]">
            View CV
          </div>
          <div class="inline-flex items-center justify-center bg-white text-[#E52521] border border-[#E52521] font-medium text-base h-11 px-6 rounded-[10px]">
            Download CV
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Backdrop (Dimmed) -->
  <div class="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-6">
    <!-- Centered Modal -->
    <div class="relative bg-white rounded-lg shadow-2xl p-6 flex flex-col items-center">
      
      <!-- Small close "X" in top right corner of modal -->
      <button class="absolute top-3 right-3 text-[#14171F] hover:text-[#E52521] p-1.5 rounded transition-colors" aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Blank A4 Document Page inside modal (A4 aspect ratio ~ 1 : 1.414) -->
      <div class="w-[360px] h-[509px] bg-white border border-[#E5E7EB] shadow-sm rounded-sm"></div>

    </div>
  </div>


</body></html>
