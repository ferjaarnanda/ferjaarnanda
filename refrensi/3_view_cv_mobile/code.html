<!DOCTYPE html><html lang="id"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Developer Service - Mobile View CV Pressed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #14171F;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body class="bg-white text-[#14171F] min-h-[844px] flex justify-center">

  <!-- Mobile phone frame container (390px x 844px) -->
  <div class="w-[390px] h-[844px] bg-white relative overflow-hidden flex flex-col">

    <!-- Background Content (Dimmed) -->
    <div class="filter brightness-90 pointer-events-none select-none flex-1 flex flex-col">
      <!-- Navbar -->
      <header class="w-full bg-white border-b border-[#E5E7EB]">
        <div class="flex items-center justify-center gap-6 h-12">
          <span class="text-sm font-medium text-[#14171F] pb-1 border-b-2 border-[#E52521]">Home</span>
          <span class="text-sm font-medium text-[#14171F]">Jenis</span>
          <span class="text-sm font-medium text-[#14171F]">Paket</span>
          <span class="text-sm font-medium text-[#14171F]">Kontak</span>
        </div>
      </header>

      <!-- Main Content -->
      <main class="px-6 pt-12 flex-1">
        <h1 class="text-[28px] font-bold text-[#14171F] leading-[1.25] tracking-tight mb-4 max-w-[320px]">
          Jasa Pembuatan<br>Website untuk<br>Segala Kebutuhan
        </h1>
        <p class="text-[15px] text-[#6B7280] leading-[1.6] mb-8 font-normal">
          Dari toko online, company profile, blog, sistem reservasi, sampai sistem cashier dan sistem lainnya.
        </p>
        <div class="flex items-center gap-3">
          <div class="inline-flex items-center justify-center bg-[#E52521] text-white font-medium text-sm h-[44px] px-6 rounded-[10px]">
            View CV
          </div>
          <div class="inline-flex items-center justify-center bg-white text-[#E52521] border border-[#E52521] font-medium text-sm h-[44px] px-6 rounded-[10px]">
            Download CV
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Backdrop (Dimmed) -->
    <div class="absolute inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
      <!-- Centered Modal -->
      <div class="relative bg-white rounded-lg shadow-2xl p-4 flex flex-col items-center max-w-[320px]">
        
        <!-- Small close "X" in top right corner of modal -->
        <button class="absolute top-2.5 right-2.5 text-[#14171F] hover:text-[#E52521] p-1 rounded transition-colors" aria-label="Close modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Blank A4 Document Page inside modal (A4 aspect ratio ~ 1 : 1.414) -->
        <div class="w-[240px] h-[339px] bg-white border border-[#E5E7EB] shadow-sm rounded-sm"></div>

      </div>
    </div>

  </div>


</body></html>
